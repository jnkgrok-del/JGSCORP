<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGSCORP | Inteligência Imobiliária</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#172438;border-bottom:1px solid #34445a}
header h1{margin:0;color:#45b8f5;font-size:25px}
header p{color:#aabbd0;font-size:12px;letter-spacing:2px}
main{padding:14px}
h2{font-size:18px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
button{border:0;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer}
.filter{background:#27364b;color:white}
.filter.active{background:#45b8f5;color:#071421}
#map{height:55vh;min-height:350px;border-radius:12px;border:1px solid #45566e}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin:12px 0;font-size:12px;color:#cbd5e1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.blue{background:#299cff}
.green{background:#18c77a}
.card{background:#19283b;padding:15px;border-radius:10px;margin:10px 0;border:1px solid #30435c}
.card h3{margin:0 0 8px}
.card p{font-size:13px;color:#b9c8da}
.tag{font-size:11px;padding:5px 8px;border-radius:5px;background:#263b54}
footer{text-align:center;padding:20px;color:#8597ad;font-size:11px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#19283b;color:white}
</style>
</head>

<body>
<header>
<h1>JGSCORP</h1>
<p>REAL ESTATE INTELLIGENCE</p>
<div>PORTO ALEGRE • RIO GRANDE DO SUL</div>
</header>

<main>
<h2>Mapa de oportunidades imobiliárias</h2>
<div class="filters">
<button class="filter active" onclick="setFilter('both',this)">Todas</button>
<button class="filter" onclick="setFilter('premium',this)">Alto padrão</button>
<button class="filter" onclick="setFilter('mcmv',this)">Minha Casa Minha Vida</button>
</div>

<div class="legend">
<span><i class="dot blue"></i>Alto padrão</span>
<span><i class="dot green"></i>MCMV</span>
</div>

<div id="map"></div>

<h2>Oportunidades no mapa</h2>
<div id="results"></div>
</main>

<footer>
JGSCORP © 2026 | INTELIGÊNCIA TERRITORIAL<br>
Versão experimental — dados demonstrativos.
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map=L.map('map').setView([-30.0346,-51.2177],11);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{attribution:'Tiles © Esri',maxZoom:19}
).addTo(map);

L.tileLayer(
'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
{attribution:'Labels © Esri',maxZoom:19}
).addTo(map);

const terrenos=[
{
id:1,tipo:'premium',nome:'Área demonstrativa — Zona Sul',
bairro:'Ipanema (referência aproximada)',
area:'2.500 m²',lat:-30.1270,lon:-51.2200,
descricao:'Ponto de estudo para empreendimento residencial de alto padrão.'
},
{
id:2,tipo:'premium',nome:'Área demonstrativa — Tristeza',
bairro:'Tristeza (referência aproximada)',
area:'1.800 m²',lat:-30.1150,lon:-51.2500,
descricao:'Ponto de estudo para condomínio residencial.'
},
{
id:3,tipo:'mcmv',nome:'Área demonstrativa — Restinga',
bairro:'Restinga (referência aproximada)',
area:'8.000 m²',lat:-30.1400,lon:-51.1360,
descricao:'Ponto de estudo para empreendimento habitacional econômico.'
},
{
id:4,tipo:'mcmv',nome:'Área demonstrativa — Lomba do Pinheiro',
bairro:'Lomba do Pinheiro (referência aproximada)',
area:'6.500 m²',lat:-30.1050,lon:-51.1350,
descricao:'Ponto de estudo para condomínio habitacional.'
}
];

let filter='both';
let markers=[];

function render(){
markers.forEach(m=>map.removeLayer(m));
markers=[];
const results=document.getElementById('results');
results.innerHTML='';

const filtered=terrenos.filter(t=>filter==='both'||t.tipo===filter);

filtered.forEach(t=>{
const color=t.tipo==='premium'?'#299cff':'#18c77a';

const marker=L.circleMarker([t.lat,t.lon],{
radius:10,color:color,fillColor:color,fillOpacity:.9,weight:2
}).addTo(map);

marker.bindPopup(
'<b>'+t.nome+'</b><br>'+t.bairro+
'<br>Área ilustrativa: '+t.area+
'<br><br>'+t.descricao+
'<br><b>Localização demonstrativa, não é terreno identificado.</b>'
);
markers.push(marker);

const card=document.createElement('div');
card.className='card';
card.innerHTML=
'<h3>'+t.nome+'</h3>'+
'<span class="tag">'+(t.tipo==='premium'?'ALTO PADRÃO':'MCMV')+'</span>'+
'<p>'+t.bairro+'<br>Área ilustrativa: '+t.area+'</p>'+
'<button class="filter active">Ver no mapa</button>';

card.querySelector('button').onclick=()=>{
map.setView([t.lat,t.lon],15);
marker.openPopup();
};
results.appendChild(card);
});

if(filtered.length===0){
results.innerHTML='<p>Nenhum ponto nesta categoria.</p>';
}
}

function setFilter(value,button){
filter=value;
document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));
button.classList.add('active');
render();
}

render();
</script>
</body>
</html>
